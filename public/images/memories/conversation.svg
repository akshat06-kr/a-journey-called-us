<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Midnight Deep Forest Twilight Gradient -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050C0A" />
      <stop offset="35%" stop-color="#091712" />
      <stop offset="65%" stop-color="#102A23" />
      <stop offset="85%" stop-color="#1B382D" />
      <stop offset="100%" stop-color="#284A3B" />
    </linearGradient>

    <!-- Still Lake Water Gradient -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B21" />
      <stop offset="35%" stop-color="#0E211A" />
      <stop offset="70%" stop-color="#091712" />
      <stop offset="100%" stop-color="#050C0A" />
    </linearGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#DDE6DD" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#A7B9A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#102A23" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Shimmer on Lake -->
    <linearGradient id="waterShimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#DDE6DD" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#C9AE7C" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#091712" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1200" height="750" fill="url(#twilightSky)" />

  <!-- Constellations & Deep Night Stars -->
  <g fill="#FFFDF7">
    <circle cx="180" cy="90" r="1.5" opacity="0.8" />
    <circle cx="240" cy="65" r="1.2" opacity="0.7" />
    <circle cx="310" cy="110" r="1.8" opacity="0.9" />
    <circle cx="390" cy="70" r="1.2" opacity="0.6" />
    <circle cx="510" cy="140" r="1.5" opacity="0.8" />
    <circle cx="680" cy="80" r="2" opacity="0.85" />
    <circle cx="820" cy="120" r="1.2" opacity="0.7" />
    <circle cx="950" cy="60" r="1.7" opacity="0.9" />
    <circle cx="1060" cy="100" r="1.3" opacity="0.65" />
  </g>

  <!-- Luminous Crescent Moon -->
  <circle cx="780" cy="220" r="120" fill="url(#moonGlow)" />
  <circle cx="780" cy="220" r="26" fill="#FFFDF7" />
  <circle cx="788" cy="216" r="23" fill="#132B21" />

  <!-- Mountain Silhouettes across Lake -->
  <path d="M0 450 Q 280 390, 560 430 T 980 400 T 1200 440 L 1200 500 L 0 500 Z" fill="#0A1813" />

  <!-- Calm Still Lake -->
  <rect y="460" width="1200" height="290" fill="url(#lakeGrad)" />

  <!-- Moon Reflection Shimmer on Water -->
  <g opacity="0.7">
    <ellipse cx="780" cy="485" rx="35" ry="3" fill="#FFFDF7" opacity="0.6" />
    <ellipse cx="780" cy="505" rx="45" ry="3" fill="#DDE6DD" opacity="0.5" />
    <ellipse cx="780" cy="528" rx="60" ry="3.5" fill="#DDE6DD" opacity="0.45" />
    <ellipse cx="780" cy="555" rx="75" ry="4" fill="#C9AE7C" opacity="0.35" />
    <ellipse cx="780" cy="585" rx="90" ry="4.5" fill="#C9AE7C" opacity="0.25" />
    <ellipse cx="780" cy="620" rx="110" ry="5" fill="#A7B9A6" opacity="0.2" />
    <ellipse cx="780" cy="660" rx="130" ry="5.5" fill="#1D3B2F" opacity="0.15" />
  </g>

  <!-- Shoreline / Forest Bank Foreground -->
  <path d="M0 550 Q 350 510, 700 580 T 1200 540 L 1200 750 L 0 750 Z" fill="#07130E" />

  <!-- Tall Pine Silhouettes on Bank Framing Scene -->
  <g fill="#050C0A">
    <!-- Left Group -->
    <polygon points="120,560 145,260 170,560" />
    <polygon points="160,570 190,290 220,570" />
    <polygon points="70,580 100,340 130,580" />
    <!-- Tiers of Pine branches -->
    <polygon points="110,480 145,410 180,480" />
    <polygon points="125,410 145,350 165,410" />

    <!-- Right Group -->
    <polygon points="1020,570 1055,270 1090,570" />
    <polygon points="1070,580 1105,320 1140,580" />
    <polygon points="970,590 1005,360 1040,590" />
  </g>

  <!-- Lakeside Bench Under Stars: A Symbol of Quiet Truth and Respect -->
  <g>
    <rect x="420" y="615" width="160" height="7" rx="2" fill="#1D3B2F" />
    <rect x="420" y="626" width="160" height="7" rx="2" fill="#1D3B2F" />
    <polygon points="415,637 585,637 575,649 405,649" fill="#C9AE7C" opacity="0.6" />
    <line x1="430" y1="649" x2="425" y2="675" stroke="#050C0A" stroke-width="4" />
    <line x1="570" y1="649" x2="575" y2="675" stroke="#050C0A" stroke-width="4" />

    <!-- Gentle Warm Light Spill from unseen path lamp -->
    <ellipse cx="500" cy="650" rx="90" ry="25" fill="#C9AE7C" opacity="0.12" />
  </g>

  <!-- Soft Mist Ribbon Across Lake -->
  <path d="M0 500 Q 300 480, 600 510 T 1200 490" stroke="#A7B9A6" stroke-width="20" stroke-opacity="0.08" fill="none" filter="blur(15px)" />

  <!-- Elegant Vignette Rim -->
  <rect width="1200" height="750" fill="none" stroke="#C9AE7C" stroke-width="1" stroke-opacity="0.2" />
</svg>
